<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вибродиагностика</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background: #f0f2f5; }
        .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { color: #0077FF; font-size: 20px; text-align: center; margin: 0 0 16px 0; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 600; }
        select, input { width: 100%; padding: 12px; border: 1px solid #e1e3e6; border-radius: 8px; font-size: 16px; background: #fff; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; color: #fff; margin-top: 8px; cursor: pointer; }
        .btn-primary { background: #0077FF; }
        .btn-success { background: #4BB34B; }
        #plot { width: 100%; height: 250px; margin-top: 15px; }
        .info { background: #f5f7fa; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; line-height: 1.5; }
    </style>
    <!-- Сюда загрузится Plotly, если интернет есть -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>🔧 Вибродиагностика</h1>
        
        <div class="field">
            <label>Подшипник</label>
            <select id="bearing">
                <option value="6308" selected>6308</option>
                <option value="6310">6310</option>
                <option value="6205">6205</option>
                <option value="22220">22220</option>
            </select>
        </div>
        
        <div class="field">
            <label>Обороты (об/мин)</label>
            <input type="number" id="rpm" value="1500">
        </div>
        
        <div class="field">
            <label>Тип дефекта</label>
            <select id="defect">
                <option value="BPFO" selected>BPFO (Наружное кольцо)</option>
                <option value="BPFI">BPFI (Внутреннее кольцо)</option>
                <option value="BSF">BSF (Тело качения)</option>
                <option value="FTF">FTF (Сепаратор)</option>
            </select>
        </div>
        
        <button class="btn-primary" id="btn-spectrum"> Построить спектр</button>
        <button class="btn-success" id="btn-exam"> Случайный экзамен</button>
        
        <div id="plot"></div>
        <div class="info" id="info">Нажмите кнопку выше</div>
    </div>

    <script>
        // База данных
        const DB = {
            '6308':  { n: 8,  d: 15.08, D: 65.0,  a: 0 },
            '6310':  { n: 8,  d: 18.00, D: 80.0,  a: 0 },
            '6205':  { n: 9,  d: 7.94,  D: 38.5,  a: 0 },
            '22220': { n: 28, d: 32.0,  D: 138.0, a: 0 }
        };

        // Безопасная инициализация VK (не падает, если VK не загрузился)
        window.addEventListener('load', () => {
            if (window.vkBridge) {
                window.vkBridge.send('VKWebAppInit')
                    .then(() => console.log('✅ VK OK'))
                    .catch(e => console.warn('⚠️ VK Bridge error:', e));
            }
        });

        // Расчет частот
        function getFreqs(key, rpm) {
            const b = DB[key];
            if (!b) return null;
            const fr = rpm / 60.0;
            const k = b.d / b.D;
            const c = Math.cos(b.a * Math.PI / 180);
            return {
                BPFO: (b.n/2)*fr*(1 - k*c),
                BPFI: (b.n/2)*fr*(1 + k*c),
                BSF: (b.D/(2*b.d))*fr*(1 - (k*c)**2),
                FTF: (fr/2)*(1 - k*c)
            };
        }

        // Построение графика
        function draw(key, rpm, defect) {
            const f = getFreqs(key, rpm);
            if (!f) return;

            const x = [], y = [];
            const target = f[defect] || f.BPFO;
            
            for (let i = 0; i <= 500; i += 5) {
                x.push(i);
                let v = 0.1 + Math.random()*0.05;
                if (Math.abs(i - target) < 20) v += 1.5;
                if (Math.abs(i - target*2) < 20) v += 0.8;
                y.push(v);
            }

            const data = [{ x: x, y: y, type: 'scatter', mode: 'lines', line: {color: '#0077FF'} }];
            const layout = { 
                margin: {t:10, b:30, l:30, r:10}, 
                xaxis: {range:[0,500], title:'Гц'}, 
                yaxis: {title:'g'} 
            };
            
            // Проверяем, загрузился ли Plotly
            if (window.Plotly) {
                Plotly.newPlot('plot', data, layout, {responsive: true, displayModeBar: false});
            } else {
                document.getElementById('plot').innerHTML = '<p style="text-align:center; padding:50px;">⚠️ Нет интернета (Plotly не загрузился)</p>';
            }

            document.getElementById('info').innerHTML = `
                <b>${key} @ ${rpm} об/мин</b><br>
                BPFO: ${f.BPFO.toFixed(1)} Гц<br>
                BPFI: ${f.BPFI.toFixed(1)} Гц<br>
                BSF: ${f.BSF.toFixed(1)} Гц
            `;
        }

        // Навешиваем кнопки
        document.getElementById('btn-spectrum').onclick = () => {
            draw(
                document.getElementById('bearing').value,
                parseInt(document.getElementById('rpm').value),
                document.getElementById('defect').value
            );
        };

        document.getElementById('btn-exam').onclick = () => {
            const keys = Object.keys(DB);
            const defects = ['BPFO', 'BPFI', 'BSF', 'FTF'];
            const k = keys[Math.floor(Math.random()*keys.length)];
            const d = defects[Math.floor(Math.random()*defects.length)];
            const r = [1000, 1500, 2000][Math.floor(Math.random()*3)];
            
            document.getElementById('bearing').value = k;
            document.getElementById('rpm').value = r;
            document.getElementById('defect').value = d;
            draw(k, r, d);
        };

        // Рисуем при старте
        setTimeout(() => draw('6308', 1500, 'BPFO'), 500);
    </script>
    
    <!-- VK Bridge подключаем в самом конце, чтобы не блокировать рендеринг -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</body>
</html>
