<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вибродиагностика</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        .card { background: #fff; border-radius: 10px; padding: 15px; }
        h1 { color: #0077FF; font-size: 18px; text-align: center; margin: 0 0 15px 0; }
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: 600; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; color: #fff; margin-top: 8px; cursor: pointer; }
        .btn-primary { background: #0077FF; }
        .btn-success { background: #4CAF50; }
        #plot { width: 100%; height: 250px; margin-top: 15px; }
        .info { background: #f5f7fa; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 12px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔧 Вибродиагностика</h1>
        
        <div class="field">
            <label>Подшипник</label>
            <select id="bearing">
                <option value="6205">6205</option>
                <option value="6308" selected>6308</option>
                <option value="6310">6310</option>
                <option value="22220">22220</option>
            </select>
        </div>
        
        <div class="row">
            <div class="field">
                <label>Обороты</label>
                <select id="rpm">
                    <option value="1500" selected>1500</option>
                    <option value="3000">3000</option>
                </select>
            </div>
            <div class="field">
                <label>fc (Гц)</label>
                <select id="fc">
                    <option value="2500" selected>2500</option>
                    <option value="1600">1600</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="field">
                <label>Дефект</label>
                <select id="defect">
                    <option value="BPFO" selected>BPFO</option>
                    <option value="BPFI">BPFI</option>
                    <option value="BSF">BSF</option>
                </select>
            </div>
            <div class="field">
                <label>Стадия</label>
                <select id="stage">
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                </select>
            </div>
        </div>
        
        <button class="btn-primary" onclick="draw()">📊 Построить</button>
        <button class="btn-success" onclick="exam()">🎲 Экзамен</button>
        
        <div id="plot"></div>
        <div class="info" id="info">Нажмите кнопку</div>
    </div>

    <script>
        const DB = {
            '6205': {n:9, d:7.94, D:38.5, a:0},
            '6308': {n:8, d:15.08, D:65.0, a:0},
            '6310': {n:8, d:18.00, D:80.0, a:0},
            '22220': {n:28, d:32.0, D:138.0, a:0}
        };

        function calc(b, rpm) {
            const fr = rpm/60;
            const k = b.d/b.D;
            const c = Math.cos(b.a*Math.PI/180);
            return {
                fr: fr,
                BPFO: (b.n/2)*fr*(1-k*c),
                BPFI: (b.n/2)*fr*(1+k*c),
                BSF: (b.D/(2*b.d))*fr*(1-(k*c)**2),
                FTF: (fr/2)*(1-k*c)
            };
        }

        function draw() {
            const bearing = document.getElementById('bearing').value;
            const rpm = parseInt(document.getElementById('rpm').value);
            const fc = document.getElementById('fc').value;
            const defect = document.getElementById('defect').value;
            const stage = parseInt(document.getElementById('stage').value);
            
            const f = calc(DB[bearing], rpm);
            const target = f[defect];
            
            const x=[], y=[];
            for(let i=0; i<=500; i+=5) {
                x.push(i);
                let v = 0.1 + Math.random()*0.05;
                for(let h=1; h<=stage; h++) {
                    if(Math.abs(i - target*h) < 15) v += (1-Math.abs(i-target*h)/15)*stage*0.3;
                }
                y.push(v);
            }
            
            Plotly.newPlot('plot', [{x, y, type:'scatter', mode:'lines', line:{color:'#0077FF'}}], {
                margin:{t:30,b:30,l:35,r:10},
                xaxis:{range:[0,500], title:'Гц'},
                yaxis:{title:'g'},
                title: {text: bearing+' '+rpm+'об/мин', font:{size:12}}
            }, {responsive:true, displayModeBar:false});
            
            document.getElementById('info').innerHTML = 
                bearing+' @ '+rpm+' об/мин<br>BPFO:'+f.BPFO.toFixed(1)+' Гц | BPFI:'+f.BPFI.toFixed(1)+' Гц';
        }

        function exam() {
            const b = Object.keys(DB)[Math.floor(Math.random()*4)];
            const r = [1500,3000][Math.floor(Math.random()*2)];
            const d = ['BPFO','BPFI','BSF'][Math.floor(Math.random()*3)];
            const s = [2,3][Math.floor(Math.random()*2)];
            
            document.getElementById('bearing').value = b;
            document.getElementById('rpm').value = r;
            document.getElementById('defect').value = d;
            document.getElementById('stage').value = s;
            
            const f = calc(DB[b], r);
            alert('ЭКЗАМЕН: '+b+', '+r+' об/мин, стадия '+s+'\n\nОтвет: '+d+' = '+f[d].toFixed(1)+' Гц');
            draw();
        }

        window.onload = () => { setTimeout(draw, 500); };
    </script>
</body>
</html>
